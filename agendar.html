<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agendar reunião</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #F4F5F7; --superficie: #FFFFFF; --superficie-2: #EEF0F3; --tinta: #12161C; --tinta-suave: #6B7280; --linha: #E6E8EC;
    --mar: #0E9384; --mar-forte: #0B7468; --mar-claro: #E1F5F2; --alerta: #DC2626;
    --sombra: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #0E1116; --superficie: #171B22; --superficie-2: #1F242D; --tinta: #EEF1F5; --tinta-suave: #A0A8B5; --linha: #262C36;
      --mar: #2DD4BF; --mar-forte: #5EEAD4; --mar-claro: #10302D; --sombra: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #0E1116; --superficie: #171B22; --superficie-2: #1F242D; --tinta: #EEF1F5; --tinta-suave: #A0A8B5; --linha: #262C36;
    --mar: #2DD4BF; --mar-forte: #5EEAD4; --mar-claro: #10302D; --sombra: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: 'Figtree', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { margin: 0 0 22px; color: var(--tinta-suave); font-size: 15px; line-height: 1.45; }
  .rot { font-size: 13px; font-weight: 700; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 10px; scrollbar-width: none; }
  .dias::-webkit-scrollbar { display: none; }
  .dia { flex: none; border: 0; min-width: 66px; padding: 10px 8px; border-radius: 14px; background: var(--superficie); box-shadow: var(--sombra); font: inherit; color: var(--tinta); display: grid; gap: 2px; cursor: pointer; }
  .dia small { font-size: 12px; font-weight: 600; color: var(--tinta-suave); text-transform: capitalize; }
  .dia b { font-size: 20px; font-weight: 800; }
  .dia span { font-size: 11px; color: var(--tinta-suave); }
  .dia.on { background: var(--mar); color: #fff; }
  .dia.on small, .dia.on span { color: rgba(255,255,255,.85); }
  .cartao { background: var(--superficie); border-radius: 20px; box-shadow: var(--sombra); padding: 16px; }
  .cartao h2 { margin: 0 0 12px; font-size: 17px; text-transform: capitalize; }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .hora { border: 1.5px solid var(--linha); background: var(--superficie); color: var(--tinta); border-radius: 12px; padding: 12px 0; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .hora.on { border-color: var(--mar); background: var(--mar-claro); color: var(--mar-forte); }
  .rodape { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--fundo) 30%); }
  .rodape div { max-width: 520px; margin: 0 auto; }
  .btn { width: 100%; border: 0; border-radius: 16px; padding: 16px; font: inherit; font-size: 17px; font-weight: 700; background: var(--mar); color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: default; }
  .estado { text-align: center; padding: 60px 8px; }
  .estado .ic { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; background: var(--mar-claro); color: var(--mar-forte); font-size: 30px; }
  .estado.erro .ic { background: #FDE8E8; color: var(--alerta); }
  .estado p { color: var(--tinta-suave); line-height: 1.5; margin: 6px 0 0; }
  .erro-msg { color: var(--alerta); font-size: 14px; margin: 10px 0 0; text-align: center; min-height: 1em; }
  .carregando { color: var(--tinta-suave); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<main id="m"><p class="carregando">Carregando horários livres…</p></main>
<div class="rodape" id="rodape" hidden><div><button class="btn" id="confirmar" disabled>Escolha um horário</button><p class="erro-msg" id="erro"></p></div></div>
<script>
const API = 'https://mavjbevuhzalkqyxaajw.supabase.co/functions/v1/agenda';
const token = new URLSearchParams(location.search).get('t') || '';
const m = document.getElementById('m'), rodape = document.getElementById('rodape'), bt = document.getElementById('confirmar'), erroEl = document.getElementById('erro');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let dados = null, diaSel = 0, escolhido = null;
const duracao = (min) => (min < 60 ? `${min} min` : min % 60 ? `${Math.floor(min / 60)}h${min % 60}` : `${min / 60} h`);

function estado(tipo, titulo, texto) {
  rodape.hidden = true;
  m.innerHTML = `<div class="estado ${tipo === 'erro' ? 'erro' : ''}"><div class="ic">${tipo === 'erro' ? '!' : '✓'}</div><h1>${esc(titulo)}</h1><p>${esc(texto)}</p></div>`;
}

function desenhar() {
  const d = dados.dias[diaSel];
  const ola = dados.nome ? `Olá, ${esc(dados.nome)}! ` : '';
  m.innerHTML = `<h1>Agendar reunião</h1>
    <p class="sub">${ola}Escolha o dia e o horário que ficam melhor para você. A reunião dura ${duracao(dados.duracao_min)}.</p>
    <p class="rot">Dia</p>
    <div class="dias">${dados.dias.map((x, i) => {
      const [sem, data] = x.rotulo.split(', ');
      return `<button class="dia ${i === diaSel ? 'on' : ''}" data-i="${i}"><small>${esc(sem.slice(0, 3))}</small><b>${esc(data.slice(0, 2))}</b><span>${x.horarios.length} horário${x.horarios.length > 1 ? 's' : ''}</span></button>`;
    }).join('')}</div>
    <div class="cartao"><h2>${esc(d.rotulo)}</h2><div class="horas">${d.horarios.map((h) => `<button class="hora ${escolhido?.inicio === h.inicio ? 'on' : ''}" data-h="${esc(h.inicio)}">${esc(h.hora)}</button>`).join('')}</div></div>`;
  m.querySelectorAll('.dia').forEach((b) => b.onclick = () => { diaSel = Number(b.dataset.i); desenhar(); });
  m.querySelectorAll('.hora').forEach((b) => b.onclick = () => {
    escolhido = { inicio: b.dataset.h, texto: `${d.rotulo} às ${b.textContent}` };
    erroEl.textContent = ''; desenhar();
  });
  rodape.hidden = false;
  bt.disabled = !escolhido;
  bt.textContent = escolhido ? `Confirmar ${escolhido.texto.replace(/^(\w+)-feira/, '$1')}` : 'Escolha um horário';
}

bt.onclick = async () => {
  if (!escolhido) return;
  bt.disabled = true; bt.textContent = 'Confirmando…'; erroEl.textContent = '';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, inicio: escolhido.inicio }) });
    const j = await r.json().catch(() => ({}));
    if (j.ok) { estado('ok', 'Reunião confirmada!', `${j.rotulo}. Você também recebe a confirmação pelo WhatsApp.`); return; }
    erroEl.textContent = j.motivo || j.erro || 'Não consegui confirmar. Tente outro horário.';
    escolhido = null; await carregar(false);
  } catch { erroEl.textContent = 'Sem conexão. Tente de novo.'; bt.disabled = false; bt.textContent = 'Tentar de novo'; }
};

async function carregar(primeira = true) {
  if (!token) { estado('erro', 'Link incompleto', 'Abra o link exatamente como recebeu no WhatsApp.'); return; }
  try {
    const r = await fetch(`${API}?t=${encodeURIComponent(token)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { estado('erro', 'Link indisponível', j.erro || 'Peça um novo link pelo WhatsApp.'); return; }
    if (j.marcado) { estado('ok', 'Sua reunião já está marcada', `${j.marcado.rotulo}. Se precisar mudar, é só avisar pelo WhatsApp.`); return; }
    if (!j.dias?.length) { estado('erro', 'Sem horários livres agora', 'A agenda está cheia nos próximos dias. Responda pelo WhatsApp que retornamos com uma data.'); return; }
    dados = j; if (primeira || diaSel >= j.dias.length) diaSel = 0;
    desenhar();
  } catch { estado('erro', 'Sem conexão', 'Verifique a internet e abra o link de novo.'); }
}
carregar();
</script>
</body>
</html>
